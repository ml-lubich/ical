[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ical-mcp"
version = "0.2.2"
description = "macOS Calendar.app CLI and MCP server — list calendars, schedule events, invite attendees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["calendar", "macos", "cli", "mcp", "applescript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
    "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/ical"
Repository = "https://github.com/ml-lubich/ical"
Issues = "https://github.com/ml-lubich/ical/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ical = "ical.cli:app"
ical-mcp = "ical.mcp:run_server"

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ical --cov-report=term-missing --cov-fail-under=80"

[tool.hatch.build.targets.wheel]
packages = ["src/ical"]

[tool.hatch.build.targets.sdist]
include = ["src/ical", "README.md", "LICENSE", "pyproject.toml"]
